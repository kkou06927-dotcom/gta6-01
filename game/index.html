<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay Heat — an open-world crime sandbox</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101820; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Solmar Bay Heat: explore the city on foot or steal a car, run three story missions for Dario Fenn, and dodge the police. WASD or arrows to move and drive, E to enter or exit a car, mouse to aim, click to shoot, space to punch, P to pause."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
